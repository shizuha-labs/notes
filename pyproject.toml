[project]
name = "shizuha-notes"
version = "0.1.0"
description = "Shizuha Notes service"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Django>=5.2.16,<6.0",
    "djangorestframework>=3.14.0",
    "django-celery-beat>=2.5.0",
    "celery>=5.3.0",
    "redis>=4.5.0",
    "psycopg2-binary>=2.9.0",
    "django-cors-headers>=4.0.0",
    "requests>=2.31.0",
    "drf-spectacular>=0.27.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-allauth>=65.14.1",
    "dj-rest-auth>=5.0.0",
    "PyJWT>=2.15.0,<3",
    "cryptography>=50.0.0",
    "Pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "python-magic>=0.4.27",
    "boto3>=1.28.0",
    "django-storages>=1.14.0",
    "mcp>=1.28.1,<2.0",
    "shizuha-storage",
    # Security floor (PLAT-6225 / GHSA-65pc-fj4g-8rjx / PYSEC-2026-215):
    # transitive via requests/httpx/anyio — pin the patched minimum explicitly.
    "idna>=3.15",
    "gunicorn==26.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shizuha-storage = { path = "packages/shizuha-storage" }
