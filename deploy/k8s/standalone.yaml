# PLAT-353 mail OIDC pilot — STANDALONE test instance (isolated from live mail).
# Verifies "Sign in with Shizuha ID" end-to-end before the move-out is concluded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shizuha-notes-standalone
  namespace: shizuha
  labels: {app: shizuha-notes-standalone, pilot: plat-352-notes}
spec:
  replicas: 1
  selector: {matchLabels: {app: shizuha-notes-standalone}}
  template:
    metadata:
      labels: {app: shizuha-notes-standalone, pilot: plat-352-notes}
    spec:
      nodeSelector: {kubernetes.io/hostname: s1}
      tolerations:
      - {key: node.shizuha/workstation, operator: Exists, effect: NoSchedule}
      containers:
      - name: notes
        image: localhost:30500/shizuha-notes:oidc-pilot-5a14ad6
        ports: [{containerPort: 8012}]
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef: {name: shizuha-notes-installation, key: POSTGRES_HOST}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_USER, value: "postgres"}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: shizuha-secrets, key: postgres-password}}
        - {name: POSTGRES_DB, value: "shizuha_notes"}
        # HS256 grace key present for now; flipped off later via MAIL_DISABLE_HS256
        - name: JWT_SECRET_KEY
          valueFrom: {secretKeyRef: {name: shizuha-secrets, key: jwt-secret}}
        - name: SHIZUHA_ID_API_URL
          valueFrom:
            configMapKeyRef: {name: shizuha-notes-installation, key: SHIZUHA_ID_API_URL}
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef: {name: shizuha-notes-installation, key: CELERY_BROKER_URL}
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            configMapKeyRef: {name: shizuha-notes-installation, key: CELERY_RESULT_BACKEND}
        - {name: DEBUG, value: "0"}
        - {name: SERVER_PORT, value: "8012"}
        - {name: ALLOWED_HOSTS, value: "*"}
        # ---- OIDC decoupling (PLAT-353) ----
        - name: SHIZUHA_OAUTH_CLIENT_ID
          valueFrom: {secretKeyRef: {name: shizuha-notes-oauth, key: OAUTH_CLIENT_ID}}
        - name: SHIZUHA_OAUTH_CLIENT_SECRET
          valueFrom: {secretKeyRef: {name: shizuha-notes-oauth, key: OAUTH_CLIENT_SECRET}}
        - {name: SHIZUHA_OAUTH_ISSUER, value: "http://shizuha-id.shizuha.svc.cluster.local:8001"}
        - {name: SHIZUHA_OAUTH_AUTHORIZE_URL, value: "http://shizuha-nginx.shizuha.svc.cluster.local/id/oauth/authorize"}
        - {name: SHIZUHA_OAUTH_JWKS_URL, value: "http://shizuha-id.shizuha.svc.cluster.local:8001/.well-known/jwks.json"}
        - {name: SHIZUHA_EXPECTED_ISSUER, value: "http://shizuha-id.shizuha.svc.cluster.local:8001"}
        - {name: SHIZUHA_SERVICE_NAME, value: "notes"}
        - {name: NOTES_PUBLIC_URL, value: "http://notes-oidc-test.shizuha.svc.cluster.local:8012"}
        - {name: NOTES_FRONTEND_URL, value: "http://notes-oidc-test.shizuha.svc.cluster.local:8012/"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: shizuha-notes-standalone
  namespace: shizuha
  labels: {app: shizuha-notes-standalone, pilot: plat-352-notes}
spec:
  selector: {app: shizuha-notes-standalone}
  ports: [{port: 8012, targetPort: 8012}]
