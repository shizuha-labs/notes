[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:migrate]
command=/app/.venv/bin/python manage.py migrate --noinput
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=1

[program:createdb]
command=/app/.venv/bin/python manage.py createdb
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=2

[program:django]
command=/app/.venv/bin/python manage.py runserver 0.0.0.0:8012
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="notesmanager.settings"
priority=10

[program:celery-worker]
command=/app/.venv/bin/celery -A notesmanager worker --loglevel=info --concurrency=1 -Q shizuha_notes
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="notesmanager.settings"
priority=11

[program:celery-beat]
command=/app/.venv/bin/celery -A notesmanager beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="notesmanager.settings"
priority=12

[program:mcp-server]
command=/app/.venv/bin/python /app/mcp-server/notes_server.py --http-port 18104
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_NOTES_URL="http://localhost:8012",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=10

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
